catalogMode: prefer
cleanupUnusedCatalogs: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - nuxtseo-layer-devtools
  - nuxtseo-shared
  - satori@0.33.5
  - fontless@1.1.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - chokidar@4.0.3
  - eslint-import-resolver-typescript@3.10.1
  - undici-types@6.21.0
  - semver@6.3.1
  - koa@2.16.3
  - semver@5.7.2
  - '@nuxtjs/tailwindcss@7.0.0-beta.1'
  - tinyexec@1.2.2

shellEmulator: true

packages:
  - playground
  - '!examples/**'

overrides:
  '@unhead/vue': ^3.4.1
  unhead: ^3.4.1
  vite: 8.3.0
  vitest-environment-nuxt: 2.0.0
  vue: ^3.5.43

allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - better-sqlite3
  - esbuild
  - sharp
  - unrs-resolver
  - vue-demi

