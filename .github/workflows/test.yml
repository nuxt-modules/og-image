name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: harlan-zw/nuxt-seo/.github/workflows/reusable-ci.yml@main
    with:
      test-command: pnpm test:run

  packed-install-smoke:
    name: Packed install smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:packed-install

  takumi-e2e-matrix:
    name: Takumi e2e matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      - run: pnpm run test:takumi:e2e:matrix

  browser-prerender:
    name: Browser prerender (screenshot pages)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - run: pnpm install --frozen-lockfile

      - run: pnpm dev:prepare

      # The container ships browsers for playwright 1.58; install the revision
      # matching the repo's playwright-core so the prerender launch finds it.
      - run: pnpm exec playwright-core install chromium

      - run: pnpm exec vitest run test/e2e-not-nuxt/browser-prerender.test.ts
        env:
          HAS_CHROME: true

  peer-compatibility:
    name: Peer compatibility (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [minimum, current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm run test:peers ${{ matrix.profile }}
