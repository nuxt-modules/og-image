name: Edge Startup Comment

on:
  workflow_run:
    workflows:
      - Edge Startup Benchmark
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    permissions:
      actions: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve pull request
        id: pull-request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: run.id,
              per_page: 100,
            })
            if (!artifacts.some(artifact => artifact.name === 'edge-startup-report' && !artifact.expired)) {
              core.info('No benchmark report is available for this run.')
              return
            }
            const headOwner = run.head_repository?.owner?.login
            if (!headOwner || !run.head_branch) {
              core.setFailed('The workflow run is missing its head repository or branch')
              return
            }

            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${headOwner}:${run.head_branch}`,
              per_page: 100,
            })
            const expectedHeadRepository = run.head_repository.full_name
            const expectedBaseRepository = `${context.repo.owner}/${context.repo.repo}`
            const matches = pullRequests.filter(pullRequest =>
              pullRequest.state === 'open'
              && pullRequest.head.sha === run.head_sha
              && pullRequest.head.repo?.full_name === expectedHeadRepository
              && pullRequest.base.repo.full_name === expectedBaseRepository,
            )

            if (matches.length !== 1) {
              core.info(`Skipping report: found ${matches.length} matching open pull requests.`)
              return
            }

            core.setOutput('number', matches[0].number)

      - name: Download edge-startup report
        if: ${{ steps.pull-request.outputs.number }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edge-startup-report
          path: ${{ runner.temp }}/edge-startup-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate edge-startup report
        if: ${{ steps.pull-request.outputs.number }}
        env:
          COMMENT_PATH: ${{ runner.temp }}/edge-startup-comment.md
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REPORT_DIR: ${{ runner.temp }}/edge-startup-report
        run: |
          report="$REPORT_DIR/report.md"
          pr_number="$REPORT_DIR/pr-number.txt"
          head_sha="$REPORT_DIR/head-sha.txt"

          for file in "$report" "$pr_number" "$head_sha"; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::Missing or invalid report file: $file"
              exit 1
            fi
          done

          if [ "$(wc -c < "$pr_number")" -gt 16 ] || [ "$(wc -c < "$head_sha")" -gt 64 ]; then
            echo "::error::Artifact metadata is too large"
            exit 1
          fi

          artifact_pr_number=$(tr -d '\r\n' < "$pr_number")
          if ! echo "$artifact_pr_number" | grep -Eq '^[0-9]+$' \
            || [ "$artifact_pr_number" != "$EXPECTED_PR_NUMBER" ]; then
            echo "::error::Artifact pull request number does not match the workflow run"
            exit 1
          fi

          if [ "$(tr -d '\r\n' < "$head_sha")" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::Artifact head SHA does not match the workflow run"
            exit 1
          fi

          report_size=$(wc -c < "$report")
          if [ "$report_size" -lt 1 ] || [ "$report_size" -gt 60000 ]; then
            echo "::error::Benchmark report must be between 1 byte and 60000 bytes"
            exit 1
          fi

          if [ "$(head -n 1 "$report")" != '### Edge startup benchmark' ]; then
            echo "::error::Benchmark report has an unexpected format"
            exit 1
          fi

          if [ -e "$COMMENT_PATH" ] || [ -L "$COMMENT_PATH" ]; then
            echo "::error::Refusing to overwrite the validated comment path"
            exit 1
          fi
          sed -e '1s/^### Edge startup benchmark$/### ⚡ Edge Startup/' -e 's/@/@<!-- -->/g' "$report" > "$COMMENT_PATH"
          if [ "$(wc -c < "$COMMENT_PATH")" -gt 60000 ]; then
            echo "::error::The comment exceeds 60000 bytes"
            exit 1
          fi

      - name: Post comment on pull request
        if: ${{ steps.pull-request.outputs.number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_PATH: ${{ runner.temp }}/edge-startup-comment.md
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          STICKY_HEADER: Edge Startup Benchmark
        with:
          script: |
            const { readFileSync } = require('node:fs')

            // The GitHub API returns transient 5xx / 429 / network errors.
            // Retry those with backoff. Any other error fails the step at once.
            async function withRetry(label, fn) {
              for (let attempt = 1; ; attempt++) {
                try {
                  return await fn()
                }
                catch (error) {
                  const status = error.status
                  const transient = status === undefined || status === 429 || status >= 500
                  if (!transient || attempt >= 5)
                    throw error
                  const wait = Math.min(2000 * 2 ** (attempt - 1), 30000)
                  core.warning(`${label} failed with a transient error (${error.message}). Retrying in ${wait}ms.`)
                  await new Promise(resolve => setTimeout(resolve, wait))
                }
              }
            }

            const { owner, repo } = context.repo
            const issueNumber = Number(process.env.PR_NUMBER)
            const { data: pullRequest } = await github.rest.pulls.get({ owner, repo, pull_number: issueNumber })
            if (pullRequest.state !== 'open' || pullRequest.head.sha !== context.payload.workflow_run.head_sha) {
              core.info('Skipping the outdated benchmark report.')
              return
            }
            const marker = `<!-- Sticky Pull Request Comment${process.env.STICKY_HEADER} -->`
            const body = `${readFileSync(process.env.COMMENT_PATH, 'utf8')}\n${marker}`

            const comments = await withRetry('issues.listComments', () =>
              github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              }),
            )
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            )

            if (!existing) {
              await withRetry('issues.createComment', () =>
                github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body }),
              )
              core.info(`Created the edge-startup comment on pull request #${issueNumber}`)
              return
            }

            if (existing.body === body) {
              core.info('The edge-startup comment is unchanged. Skipping the update.')
              return
            }

            await withRetry('issues.updateComment', () =>
              github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body }),
            )
            core.info(`Updated the edge-startup comment on pull request #${issueNumber}`)
